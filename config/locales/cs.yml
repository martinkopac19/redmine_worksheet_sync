cs:
  label_worksheet_sync: "Worksheet sync"
  text_ws_intro: "Přenáší odpracovaný čas z ws.previo.cz do Redmine. Když worksheet záznam začíná #<číslo tasku>, čas se zapíše k danému úkolu. Nastavení je centrální (jen pro administrátory)."

  label_ws_config: "Nastavení"
  label_ws_api_key: "Worksheet API klíč"
  text_ws_api_key_hint: "Centrální klíč z ws.previo.cz (Bearer). Používá se jen ke čtení worksheetů; mzdová pole se ignorují."
  label_ws_service_user: "Servisní uživatel (autor záznamů)"
  text_ws_service_user_hint: "Pod tímto uživatelem se záznamy vytvoří. Doporučeno vytvořit zvlášť účet, ne osobní."
  label_ws_service_api_key: "…nebo API klíč servisního uživatele"
  text_ws_service_api_key_hint: "Volitelné — když vyplníš, uživatel se odvodí z klíče."
  label_ws_activity: "Aktivita"
  label_ws_cron_enabled: "Zapnout automatický (cron) import"
  text_ws_cron_hint: "Cron importuje jen uzamčené dny (které už nelze ve Worksheetu upravit)."
  label_ws_cron_window: "Okno cronu (dní zpět)"
  text_ws_cron_window_hint: "Kolik dní zpět se cron při každém denním běhu podívá do Worksheetu. Okno kontroluje denně, ale každý záznam naimportuje jen jednou (už importované přeskočí přes dedup, ještě neuzamčené dny počká). Slouží jen k dohnání, kdyby cron pár dní neběžel (např. přes svátky) — proto stačí malé číslo. 10 je bezpečná předvolba; klidně nech tak."

  label_ws_mapping: "Mapování: Worksheet zaměstnanec → Redmine uživatel"
  text_ws_mapping_hint: "Importují se jen namapovaní zaměstnanci. Zvýrazněné jsou automatické tipy podle jména — zkontroluj je."
  text_ws_enter_key_first: "Nejprve zadej Worksheet API klíč a ulož — pak se načtou zaměstnanci."
  text_ws_employees_error: "Nepodařilo se načíst zaměstnance"
  label_ws_employee: "Worksheet zaměstnanec"
  label_ws_redmine_user: "Redmine uživatel"
  label_ws_skip: "— nemapovat —"

  label_ws_manual: "Ruční import"
  text_ws_manual_hint: "Náhled ti ukáže, co by se importovalo (nic nezapíše). Import zapíše čas do Redmine."
  label_ws_from: "Od"
  label_ws_to: "Do"
  label_ws_preview: "Náhled"
  label_ws_import_now: "Importovat"
  text_ws_import_confirm: "Opravdu zapsat čas do Redmine za zvolené období?"

  label_ws_preview_result: "Náhled importu"
  label_ws_import_result: "Výsledek importu"
  label_ws_imported: "K importu / importováno"
