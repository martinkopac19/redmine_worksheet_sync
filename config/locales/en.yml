en:
  label_worksheet_sync: "Worksheet sync"
  text_ws_intro: "Imports logged time from ws.previo.cz into Redmine. When a worksheet entry starts with #<issue id>, the time is logged to that issue. Configuration is central (admins only)."

  label_ws_config: "Settings"
  label_ws_api_key: "Worksheet API key"
  text_ws_api_key_hint: "Central ws.previo.cz key (Bearer). Used only to read worksheets; salary fields are ignored."
  label_ws_service_user: "Service user (author of entries)"
  text_ws_service_user_hint: "Entries are created under this user. A dedicated (non-personal) account is recommended."
  label_ws_service_api_key: "…or the service user's API key"
  text_ws_service_api_key_hint: "Optional — if set, the user is resolved from the key."
  label_ws_activity: "Activity"
  label_ws_cron_enabled: "Enable automatic (cron) import"
  text_ws_cron_hint: "Cron imports only locked days (that can no longer be edited in Worksheet)."
  label_ws_cron_window: "Cron window (days back)"
  text_ws_cron_window_hint: "How many days back the daily cron looks into Worksheet on each run. It re-checks this window every day but imports each entry only once (already-imported entries are skipped via dedup, not-yet-locked days wait). It only exists to catch up if the cron didn't run for a few days (e.g. over holidays) — so a small number is enough. 10 is a safe default; you can leave it as is."

  label_ws_mapping: "Mapping: Worksheet employee → Redmine user"
  text_ws_mapping_hint: "Only mapped employees are imported. Highlighted rows are automatic name-based guesses — please check them."
  text_ws_enter_key_first: "Enter the Worksheet API key and save first — employees will then load."
  text_ws_employees_error: "Could not load employees"
  label_ws_employee: "Worksheet employee"
  label_ws_redmine_user: "Redmine user"
  label_ws_skip: "— do not map —"

  label_ws_manual: "Manual import"
  text_ws_manual_hint: "Preview shows what would be imported (writes nothing). Import writes the time into Redmine."
  label_ws_from: "From"
  label_ws_to: "To"
  label_ws_preview: "Preview"
  label_ws_import_now: "Import"
  text_ws_import_confirm: "Really write time into Redmine for the selected period?"

  label_ws_preview_result: "Import preview"
  label_ws_import_result: "Import result"
  label_ws_imported: "To import / imported"
  label_ws_dup: "Already imported"
  label_ws_no_issue: "Issue not found"
  label_ws_no_perm: "No permission to log time"
  label_ws_locked: "Not locked yet"
  label_ws_not_matching: "No #tag"
  label_ws_person: "Person"
  label_ws_will_import: "will import"
  label_ws_done: "done"
